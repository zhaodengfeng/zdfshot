<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆：深色底更显专业，或者用微渐变 -->
  <circle cx="128" cy="128" r="128" fill="url(#bg_gradient)"/>
  
  <!-- 外圈装饰环 -->
  <circle cx="128" cy="128" r="90" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- 快门叶片：现代几何风格 -->
  <path d="M128 64L160 96L128 128L96 96L128 64Z" fill="white" fill-opacity="0.9"/>
  <path d="M128 192L96 160L128 128L160 160L128 192Z" fill="white" fill-opacity="0.9"/>
  <path d="M64 128L96 96L128 128L96 160L64 128Z" fill="white" fill-opacity="0.7"/>
  <path d="M192 128L160 160L128 128L160 96L192 128Z" fill="white" fill-opacity="0.7"/>
  
  <!-- 中心镜头点 -->
  <circle cx="128" cy="128" r="16" fill="white"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#7C3AED"/> <!-- Violet 600 -->
    </linearGradient>
  </defs>
</svg>
