<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZDFShot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f6f8fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f3f4f6;
      --border: #d0d7de;
      --text: #1f2328;
      --text-secondary: #656d76;
      --primary: #0969da;
      --radius: 8px;
    }

    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--primary);
    }

    .btn svg, .btn img {
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .btn:hover svg {
      color: var(--primary);
    }

    .btn-primary {
      background: #f6f8fa;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-primary:hover {
      background: var(--bg-tertiary);
      border-color: var(--primary);
    }

    .btn-primary svg {
      color: var(--text-secondary);
    }

    .btn-primary:hover svg {
      color: var(--primary);
    }

    .hint {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .version {
      position: fixed;
      bottom: 4px;
      right: 8px;
      font-size: 10px;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    kbd {
      padding: 2px 5px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'SF Mono', monospace;
      font-size: 10px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon32.png" alt="ZDFShot">
    </div>
    <div>
      <div class="title">ZDFShot</div>
      <div class="subtitle" data-i18n="tagline"></div>
    </div>
  </div>
  
  <button class="btn" id="captureVisible">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
    <span data-i18n="captureVisible"></span>
  </button>
  
  <button class="btn" id="captureArea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/>
    </svg>
    <span data-i18n="captureArea"></span>
  </button>
  
  <button class="btn" id="captureFull">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="2" width="20" height="20" rx="2"/>
      <path d="M2 7h20"/>
    </svg>
    <span data-i18n="captureFull"></span>
  </button>

  <button class="btn" id="captureScroll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="2" width="20" height="20" rx="2"/>
      <path d="M12 6v12M8 16l4 4 4-4"/>
    </svg>
    <span data-i18n="captureScroll"></span>
  </button>

  <button class="btn" id="captureAreaScroll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <path d="M8 16l4 4 4-4"/>
      <path d="M4 9h16"/>
    </svg>
    <span data-i18n="captureAreaScroll"></span>
  </button>

  <div class="hint" data-i18n="popupHint"></div>
  <div class="version">v1.5.0</div>

  <script src="popup.js"></script>
</body>
</html>
